version: "3.8"

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://boarduser:boardpass_change_me@db:5432/board?schema=public
      - ADMIN_PASSWORD_B64=JDJiJDEwJEtBaHpUNEN0N1Z0TkJNOUU5OXZFbE94ODVNck9saFFZL1VpN1h3eG5FYjRQYnV0YkR2bFVT
      - JWT_SECRET=SyrianBoard_Direct_2026_SecretKey_DoNotShare_8f3k2m1x7p5q4w6e8r0t2y4u6i8o0a1b3c5d7e9f
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=board
      - POSTGRES_USER=boarduser
      - POSTGRES_PASSWORD=boardpass_change_me
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boarduser -d board"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
